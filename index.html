<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPL 筋トレカレンダー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="theme-color" content="#111827">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-20 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider text-orange-400">📅 PPL 筋トレカレンダー</h1>
            <div class="flex gap-2">
                <button onclick="exportData()" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg border border-gray-600 transition">出力</button>
                <label class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg border border-gray-600 cursor-pointer transition">
                    復元
                    <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
                </label>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-md w-full mx-auto p-4 flex-grow pb-24 space-y-6">
        
        <!-- 入力フォーム -->
        <form id="workoutForm" class="bg-gray-800 border border-gray-700 rounded-2xl p-4 shadow-lg space-y-4">
            <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">今日のトレーニングを記録</h2>
            
            <div>
                <label class="block text-xs text-gray-400 mb-1">種目名</label>
                <input type="text" id="exerciseName" required placeholder="例: ベンチプレス" 
                    class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-orange-500 transition">
            </div>

            <div class="space-y-2">
                <div class="flex justify-between items-center text-xs text-gray-400 px-1">
                    <span>セットごとの重量 × 回数</span>
                </div>
                <div id="setsContainer" class="space-y-2">
                    <div class="set-row flex items-center gap-2">
                        <span class="set-label text-xs font-bold text-gray-400 w-6 text-center">1.</span>
                        <input type="number" step="0.5" required placeholder="kg" 
                            class="weight-input w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-white text-center focus:outline-none focus:border-orange-500 transition">
                        <span class="text-gray-500 font-bold">×</span>
                        <input type="number" required placeholder="回" 
                            class="reps-input w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-white text-center focus:outline-none focus:border-orange-500 transition">
                        <button type="button" onclick="removeSetRow(this)" style="visibility: hidden;" class="text-gray-500 hover:text-red-400 p-1.5 transition">✕</button>
                    </div>
                </div>
                <button type="button" onclick="addSetRow()" 
                    class="w-full py-2 border border-dashed border-gray-600 hover:border-orange-400 text-gray-300 hover:text-orange-400 rounded-xl text-sm font-medium transition flex items-center justify-center gap-1">
                    ＋ セットを追加
                </button>
            </div>

            <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl shadow-md transition active:scale-[0.98]">
                記録を保存する
            </button>
        </form>

        <!-- 壁掛けカレンダー表示エリア -->
        <div class="bg-gray-800 border border-gray-700 rounded-2xl p-4 shadow space-y-4">
            <!-- 月切り替えヘッダー -->
            <div class="flex justify-between items-center">
                <button onclick="changeMonth(-1)" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-xl text-sm font-bold transition">◀ 前月</button>
                <h2 id="calendarMonthTitle" class="text-base font-bold text-orange-400">2026年 11月</h2>
                <button onclick="changeMonth(1)" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-xl text-sm font-bold transition">翌月 ▶</button>
            </div>

            <!-- 曜日の見出し (日〜土) -->
            <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-gray-400">
                <span class="text-red-400">日</span>
                <span>月</span>
                <span>火</span>
                <span>水</span>
                <span>木</span>
                <span>金</span>
                <span class="text-blue-400">土</span>
            </div>

            <!-- カレンダーのマス目グリッド -->
            <div id="calendarGrid" class="grid grid-cols-7 gap-1">
                <!-- JavaScriptでここに日付マスが生成されます -->
            </div>
        </div>

        <!-- 選択した日付の詳細表示エリア -->
        <div id="dayDetailCard" class="bg-gray-800 border border-gray-700 rounded-2xl p-4 shadow space-y-3 hidden">
            <div class="flex justify-between items-center border-b border-gray-700 pb-2">
                <h3 id="selectedDateTitle" class="text-sm font-bold text-orange-400">📅 日付の記録</h3>
                <button onclick="closeDetail()" class="text-xs text-gray-400 hover:text-white px-2 py-1 rounded bg-gray-700">閉じる</button>
            </div>
            <div id="selectedDateContent" class="space-y-3">
                <!-- 選択した日のトレーニング一覧 -->
            </div>
        </div>

    </main>

    <!-- スクリプト -->
    <script>
        let workouts = JSON.parse(localStorage.getItem('simple_workouts')) || [];
        
        // 現在表示しているカレンダーの年月（初期値は今日）
        let currentDate = new Date();
        let currentYear = currentDate.getFullYear();
        let currentMonth = currentDate.getMonth(); // 0〜11
        let selectedDateStr = null;

        const form = document.getElementById('workoutForm');
        const setsContainer = document.getElementById('setsContainer');
        const calendarGrid = document.getElementById('calendarGrid');
        const calendarMonthTitle = document.getElementById('calendarMonthTitle');
        const dayDetailCard = document.getElementById('dayDetailCard');
        const selectedDateTitle = document.getElementById('selectedDateTitle');
        const selectedDateContent = document.getElementById('selectedDateContent');

        function getPplTag(name) {
            const n = name.toLowerCase();
            if (n.includes('ベンチ') || n.includes('プレス') || n.includes('チェスト') || n.includes('ショルダー') || n.includes('レイズ') || n.includes('ディップス') || n.includes('プッシュ') || n.includes('三頭') || n.includes('ダンベルプレス')) {
                return { text: 'PUSH', bg: 'bg-red-900 text-red-300 border-red-700' };
            }
            if (n.includes('プル') || n.includes('ロー') || n.includes('チン') || n.includes('ラット') || n.includes('デッド') || n.includes('カール') || n.includes('背中') || n.includes('二頭')) {
                return { text: 'PULL', bg: 'bg-blue-900 text-blue-300 border-blue-700' };
            }
            if (n.includes('スクワット') || n.includes('レッグ') || n.includes('カーフ') || n.includes('ランジ') || n.includes('脚') || n.includes('腹') || n.includes('アブ')) {
                return { text: 'LEGS', bg: 'bg-emerald-900 text-emerald-300 border-emerald-700' };
            }
            return { text: 'OTHER', bg: 'bg-gray-700 text-gray-300 border-gray-600' };
        }

        window.addSetRow = function(defaultWeight = '', defaultReps = '') {
            const rows = setsContainer.querySelectorAll('.set-row');
            const setNum = rows.length + 1;

            if (defaultWeight === '' && rows.length > 0) {
                const lastWeight = rows[rows.length - 1].querySelector('.weight-input').value;
                if (lastWeight) defaultWeight = lastWeight;
            }

            const row = document.createElement('div');
            row.className = 'set-row flex items-center gap-2';
            row.innerHTML = `
                <span class="set-label text-xs font-bold text-gray-400 w-6 text-center">${setNum}.</span>
                <input type="number" step="0.5" required placeholder="kg" value="${defaultWeight}"
                    class="weight-input w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-white text-center focus:outline-none focus:border-orange-500 transition">
                <span class="text-gray-500 font-bold">×</span>
                <input type="number" required placeholder="回" value="${defaultReps}"
                    class="reps-input w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-white text-center focus:outline-none focus:border-orange-500 transition">
                <button type="button" onclick="removeSetRow(this)" class="text-gray-500 hover:text-red-400 p-1.5 transition" title="削除">
                    ✕
                </button>
            `;
            setsContainer.appendChild(row);
            updateSetNumbers();
        };

        window.removeSetRow = function(btn) {
            const rows = setsContainer.querySelectorAll('.set-row');
            if (rows.length <= 1) return;
            btn.closest('.set-row').remove();
            updateSetNumbers();
        };

        function updateSetNumbers() {
            const rows = setsContainer.querySelectorAll('.set-row');
            rows.forEach((row, index) => {
                row.querySelector('.set-label').textContent = `${index + 1}.`;
                const delBtn = row.querySelector('button');
                if (rows.length === 1) {
                    delBtn.style.visibility = 'hidden';
                } else {
                    delBtn.style.visibility = 'visible';
                }
            });
        }

        function resetSetRows() {
            setsContainer.innerHTML = `
                <div class="set-row flex items-center gap-2">
                    <span class="set-label text-xs font-bold text-gray-400 w-6 text-center">1.</span>
                    <input type="number" step="0.5" required placeholder="kg" 
                        class="weight-input w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-white text-center focus:outline-none focus:border-orange-500 transition">
                    <span class="text-gray-500 font-bold">×</span>
                    <input type="number" required placeholder="回" 
                        class="reps-input w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-white text-center focus:outline-none focus:border-orange-500 transition">
                    <button type="button" onclick="removeSetRow(this)" style="visibility: hidden;" class="text-gray-500 hover:text-red-400 p-1.5 transition">✕</button>
                </div>
            `;
        }

        // 月を変更する
        window.changeMonth = function(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
            closeDetail();
        };

        // 壁掛けカレンダーを描画する関数
        function renderCalendar() {
            calendarGrid.innerHTML = '';
            calendarMonthTitle.textContent = `${currentYear}年 ${currentMonth + 1}月`;

            // 今月の1日の曜日と、日数、先月末の日数を取得
            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
            const prevTotalDays = new Date(currentYear, currentMonth, 0).getDate();

            // 今日の日付文字列（YYYY-MM-DD）
            const now = new Date();
            const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

            // 日付ごとのトレーニングデータをマップ化
            const workoutMap = {};
            workouts.forEach(item => {
                if (!workoutMap[item.dateStr]) {
                    workoutMap[item.dateStr] = [];
                }
                workoutMap[item.dateStr].push(item);
            });

            // 前月のはみ出た日数分を埋める
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const dayNum = prevTotalDays - i;
                const cell = createCell(dayNum, true);
                calendarGrid.appendChild(cell);
            }

            // 当月の日付を描画
            for (let day = 1; day <= totalDays; day++) {
                const mStr = String(currentMonth + 1).padStart(2, '0');
                const dStr = String(day).padStart(2, '0');
                const dateStr = `${currentYear}-${mStr}-${dStr}`;

                const isToday = (dateStr === todayStr);
                const dayWorkouts = workoutMap[dateStr] || [];

                const cell = createCell(day, false, dateStr, isToday, dayWorkouts);
                calendarGrid.appendChild(cell);
            }

            // 翌月のはみ出た日数分でグリッドのマスを埋める（42マス＝6週分に調整）
            const totalCells = firstDayIndex + totalDays;
            const nextDaysCount = totalCells <= 35 ? (35 - totalCells) : (42 - totalCells);
            for (let day = 1; day <= nextDaysCount; day++) {
                const cell = createCell(day, true);
                calendarGrid.appendChild(cell);
            }
        }

        // カレンダーの1マスを作るヘルパー関数
        function createCell(dayNum, isOtherMonth, dateStr = '', isToday = false, dayWorkouts = []) {
            const cell = document.createElement('div');
            
            // 基本のスタイリング（壁掛けカレンダーの四角いマス）
            let baseClasses = "h-20 bg-gray-900/80 border border-gray-700/60 rounded-xl p-1.5 flex flex-col justify-between overflow-hidden transition relative";
            if (isOtherMonth) {
                baseClasses += " opacity-30 bg-gray-900/30";
            } else {
                baseClasses += " hover:border-orange-500 cursor-pointer";
            }
            if (isToday) {
                baseClasses += " ring-2 ring-orange-500 bg-orange-950/20";
            }
            cell.className = baseClasses;

            // 日付数字のカラー
            let numColor = "text-xs font-bold text-gray-300";
            if (isToday) numColor = "text-xs font-bold text-orange-400";

            // その日やった部位のスタンプ（バッジ）タグ生成
            let tagsHtml = '';
            if (!isOtherMonth && dayWorkouts.length > 0) {
                const tagsMap = {};
                dayWorkouts.forEach(item => {
                    const tag = getPplTag(item.name);
                    tagsMap[tag.text] = tag;
                });
                
                // スタンプっぽくコンパクトに表示
                tagsHtml = `<div class="space-y-0.5 overflow-y-auto max-h-12">`;
                Object.values(tagsMap).forEach(t => {
                    tagsHtml += `<div class="text-[9px] font-extrabold px-1 py-0.5 rounded border text-center ${t.bg}">${t.text}</div>`;
                });
                tagsHtml += `</div>`;
            }

            cell.innerHTML = `
                <div class="${numColor}">${dayNum}</div>
                ${tagsHtml}
            `;

            // 当月かつクリックされたらその日の詳細を開く
            if (!isOtherMonth && dateStr) {
                cell.onclick = () => selectDate(dateStr, dayWorkouts);
            }

            return cell;
        }

        // カレンダーのマスを押したとき、その日の詳細を下に表示する
        window.selectDate = function(dateStr, dayWorkouts) {
            selectedDateStr = dateStr;
            const [y, m, d] = dateStr.split('-');
            selectedDateTitle.textContent = `📅 ${y}年${parseInt(m)}月${parseInt(d)}日のトレーニング記録`;
            
            selectedDateContent.innerHTML = '';
            if (dayWorkouts.length === 0) {
                selectedDateContent.innerHTML = `<div class="text-xs text-gray-500 text-center py-4">この日の記録はありません。上のフォームから追加できます！</div>`;
            } else {
                dayWorkouts.forEach(item => {
                    const ppl = getPplTag(item.name);
                    let setsHtml = item.setList.map((s, idx) => `
                        <div class="text-xs text-gray-300 font-semibold flex items-center gap-2">
                            <span class="text-gray-500 w-4">${idx + 1}.</span>
                            <span class="text-orange-300">${s.weight} kg</span> × 
                            <span class="text-orange-300">${s.reps} 回</span>
                        </div>
                    `).join('');

                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'bg-gray-900 border border-gray-700/80 rounded-xl p-3 flex justify-between items-start';
                    itemDiv.innerHTML = `
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded border ${ppl.bg}">${ppl.text}</span>
                                <span class="text-sm font-bold text-white">${escapeHtml(item.name)}</span>
                            </div>
                            <div class="space-y-0.5">${setsHtml}</div>
                        </div>
                        <button onclick="deleteWorkout('${item.id}')" class="text-gray-500 hover:text-red-400 p-1.5 transition" title="削除">
                            ✕
                        </button>
                    `;
                    selectedDateContent.appendChild(itemDiv);
                });
            }

            dayDetailCard.classList.remove('hidden');
            dayDetailCard.scrollIntoView({ behavior: 'smooth' });
        };

        window.closeDetail = function() {
            dayDetailCard.classList.add('hidden');
            selectedDateStr = null;
        };

        // フォーム送信時（今日の日付で保存、または選択中の日付があればそこに保存することも可能）
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('exerciseName').value.trim();
            
            const rows = setsContainer.querySelectorAll('.set-row');
            const newSets = [];
            rows.forEach(row => {
                const weight = parseFloat(row.querySelector('.weight-input').value);
                const reps = parseInt(row.querySelector('.reps-input').value);
                if (!isNaN(weight) && !isNaN(reps)) {
                    newSets.push({ weight, reps });
                }
            });

            if (newSets.length === 0) return;

            // 記録する日付（もしカレンダーで特定の日付を開いていればそこに、そうでなければ今日）
            let dateStr = selectedDateStr;
            if (!dateStr) {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                dateStr = `${year}-${month}-${day}`;
            }

            const existingWorkout = workouts.find(item => item.dateStr === dateStr && item.name === name);

            if (existingWorkout) {
                existingWorkout.setList = existingWorkout.setList.concat(newSets);
            } else {
                const newWorkout = {
                    id: Date.now().toString(),
                    name,
                    dateStr,
                    setList: newSets
                };
                workouts.push(newWorkout);
            }

            localStorage.setItem('simple_workouts', JSON.stringify(workouts));
            
            document.getElementById('exerciseName').value = '';
            resetSetRows();
            document.getElementById('exerciseName').focus();

            renderCalendar();
            if (selectedDateStr) {
                // 開いている詳細を更新
                const updatedDayWorkouts = workouts.filter(item => item.dateStr === selectedDateStr);
                sel
