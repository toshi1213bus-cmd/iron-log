<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンプル筋トレ記録</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="theme-color" content="#111827">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-10 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider text-orange-400">💪 筋トレメモ</h1>
            <div class="flex gap-2">
                <button onclick="exportData()" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg border border-gray-600 transition">出力</button>
                <label class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg border border-gray-600 cursor-pointer transition">
                    復元
                    <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
                </label>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-md w-full mx-auto p-4 flex-grow pb-24">
        
        <!-- 入力フォーム -->
        <form id="workoutForm" class="bg-gray-800 border border-gray-700 rounded-2xl p-4 mb-6 shadow-lg space-y-4">
            <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">新しい記録を追加</h2>
            
            <div>
                <label class="block text-xs text-gray-400 mb-1">種目名</label>
                <input type="text" id="exerciseName" required placeholder="例: ベンチプレス" 
                    class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-orange-500 transition">
            </div>

            <!-- セット入力エリア -->
            <div class="space-y-2">
                <div class="flex justify-between items-center text-xs text-gray-400 px-1">
                    <span>セットごとの重量 × 回数</span>
                </div>
                <div id="setsContainer" class="space-y-2">
                    <!-- 1セット目の初期行 -->
                </div>
                <button type="button" onclick="addSetRow()" 
                    class="w-full py-2 border border-dashed border-gray-600 hover:border-orange-400 text-gray-300 hover:text-orange-400 rounded-xl text-sm font-medium transition flex items-center justify-center gap-1">
                    ＋ セットを追加
                </button>
            </div>

            <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl shadow-md transition active:scale-[0.98]">
                記録を保存する
            </button>
        </form>

        <!-- カレンダー＆日付フィルター機能 -->
        <div class="bg-gray-800 border border-gray-700 rounded-2xl p-4 mb-6 shadow">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">📅 カレンダー・日付絞り込み</h2>
                <button onclick="clearFilter()" id="clearFilterBtn" class="text-xs text-orange-400 hover:underline hidden">すべて表示</button>
            </div>
            <input type="date" id="calendarFilter" onchange="filterByDate(this.value)" 
                class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-orange-500 transition text-sm">
        </div>

        <!-- 履歴一覧 -->
        <div class="space-y-4">
            <div class="flex justify-between items-center">
                <h2 id="listTitle" class="text-sm font-semibold text-gray-400 uppercase tracking-wider">トレーニング履歴</h2>
            </div>
            <div id="workoutList" class="space-y-3"></div>
            <div id="emptyMessage" class="text-center text-gray-500 py-10 hidden">
                該当する記録はありません。
            </div>
        </div>
    </main>

    <!-- スクリプト -->
    <script>
        let workouts = JSON.parse(localStorage.getItem('simple_workouts')) || [];
        let selectedDateFilter = null;

        const form = document.getElementById('workoutForm');
        const setsContainer = document.getElementById('setsContainer');
        const workoutList = document.getElementById('workoutList');
        const emptyMessage = document.getElementById('emptyMessage');
        const calendarFilter = document.getElementById('calendarFilter');
        const clearFilterBtn = document.getElementById('clearFilterBtn');
        const listTitle = document.getElementById('listTitle');

        // セット入力行を追加する関数
        window.addSetRow = function(defaultWeight = '', defaultReps = '') {
            const rows = setsContainer.querySelectorAll('.set-row');
            const setNum = rows.length + 1;

            // 前の行があれば重量を自動コピーして入力を楽にする
            if (defaultWeight === '' && rows.length > 0) {
                const lastWeight = rows[rows.length - 1].querySelector('.weight-input').value;
                if (lastWeight) defaultWeight = lastWeight;
            }

            const row = document.createElement('div');
            row.className = 'set-row flex items-center gap-2';
            row.innerHTML = `
                <span class="set-label text-xs font-bold text-gray-400 w-6 text-center">${setNum}.</span>
                <input type="number" step="0.5" required placeholder="kg" value="${defaultWeight}"
                    class="weight-input w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-white text-center focus:outline-none focus:border-orange-500 transition">
                <span class="text-gray-500 font-bold">×</span>
                <input type="number" required placeholder="回" value="${defaultReps}"
                    class="reps-input w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-white text-center focus:outline-none focus:border-orange-500 transition">
                <button type="button" onclick="removeSetRow(this)" class="text-gray-500 hover:text-red-400 p-1.5 transition" title="このセットを削除">
                    ✕
                </button>
            `;
            setsContainer.appendChild(row);
            updateSetNumbers();
        };

        // セット入力行を削除する関数（最低1行は残す）
        window.removeSetRow = function(btn) {
            const rows = setsContainer.querySelectorAll('.set-row');
            if (rows.length <= 1) return;
            btn.closest('.set-row').remove();
            updateSetNumbers();
        };

        // セット番号（1., 2., 3...）を振り直す
        function updateSetNumbers() {
            const rows = setsContainer.querySelectorAll('.set-row');
            rows.forEach((row, index) => {
                row.querySelector('.set-label').textContent = `${index + 1}.`;
                const delBtn = row.querySelector('button');
                delBtn.style.visibility = rows.length === 1 ? 'hidden' : 'visible';
            });
        }

        // 初期状態で1セット目を用意
        function resetSetRows() {
            setsContainer.innerHTML = '';
            addSetRow();
        }

        function formatDate(dateString) {
            const [year, month, day] = dateString.split('T')[0].split('-');
            const date = new Date(year, month - 1, day);
            const d = ['日', '月', '火', '水', '木', '金', '土'];
            const dayOfWeek = d[date.getDay()];
            return `${year}/${parseInt(month)}/${parseInt(day)} (${dayOfWeek})`;
        }

        // 画面に履歴を描画
        function renderWorkouts() {
            workoutList.innerHTML = '';

            let filteredWorkouts = workouts;
            if (selectedDateFilter) {
                filteredWorkouts = workouts.filter(item => item.createdAt.startsWith(selectedDateFilter));
                listTitle.textContent = `${selectedDateFilter.replace(/-/g, '/')} の記録`;
                clearFilterBtn.classList.remove('hidden');
            } else {
                listTitle.textContent = 'トレーニング履歴';
                clearFilterBtn.classList.add('hidden');
            }

            if (filteredWorkouts.length === 0) {
                emptyMessage.classList.remove('hidden');
                return;
            }
            emptyMessage.classList.add('hidden');

            const sortedWorkouts = [...filteredWorkouts].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            sortedWorkouts.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'bg-gray-800 border border-gray-700 rounded-2xl p-4 shadow flex justify-between items-start';
                
                // 新形式（複数セット配列）と旧形式（単一データ）の両方に対応して表示
                let setsHtml = '';
                if (Array.isArray(item.setList)) {
                    setsHtml = `<div class="mt-2 space-y-1">
                        ${item.setList.map((s, idx) => `
                            <div class="text-sm text-gray-300 font-semibold flex items-center gap-2">
                                <span class="text-xs text-gray-500 w-5">${idx + 1}.</span>
                                <span class="text-orange-300">${s.weight} kg</span> × 
                                <span class="text-orange-300">${s.reps} 回</span>
                            </div>
                        `).join('')}
                    </div>`;
                } else {
                    setsHtml = `<div class="text-sm text-gray-300 font-semibold mt-1">
                        <span class="text-orange-300">${item.weight} kg</span> × 
                        <span class="text-orange-300">${item.reps} 回</span> × 
                        <span class="text-gray-400">${item.sets} セット</span>
                    </div>`;
                }

                card.innerHTML = `
                    <div>
                        <div class="text-xs text-orange-400 font-medium">${formatDate(item.createdAt)}</div>
                        <div class="text-lg font-bold text-white">${escapeHtml(item.name)}</div>
                        ${setsHtml}
                    </div>
                    <button onclick="deleteWorkout('${item.id}')" class="text-gray-500 hover:text-red-400 p-2 rounded-lg transition" title="削除">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                `;
                workoutList.appendChild(card);
            });
        }

        window.filterByDate = function(dateStr) {
            selectedDateFilter = dateStr;
            renderWorkouts();
        };

        window.clearFilter = function() {
            selectedDateFilter = null;
            calendarFilter.value = '';
            renderWorkouts();
        };

        // フォーム送信時の処理
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('exerciseName').value.trim();
            
            const rows = setsContainer.querySelectorAll('.set-row');
            const setList = [];
            rows.forEach(row => {
                const weight = parseFloat(row.querySelector('.weight-input').value);
                const reps = parseInt(row.querySelector('.reps-input').value);
                if (!isNaN(weight) && !isNaN(reps)) {
                    setList.push({ weight, reps });
                }
            });

            if (setList.length === 0) return;

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const time = now.toTimeString().split(' ')[0];
            const dateTimeString = `${year}-${month}-${day}T${time}`;

            const newWorkout = {
                id: Date.now().toString(),
                name,
                setList,
                createdAt: dateTimeString
            };

            workouts.push(newWorkout);
            localStorage.setItem('simple_workouts', JSON.stringify(workouts));
            
            document.getElementById('exerciseName').value = '';
            resetSetRows();
            document.getElementById('exerciseName').focus();

            renderWorkouts();
        });

        window.deleteWorkout = function(id) {
            if (confirm('この記録を削除しますか？')) {
                workouts = workouts.filter(item => item.id !== id);
                localStorage.setItem('simple_workouts', JSON.stringify(workouts));
                renderWorkouts();
            }
        };

        window.exportData = function() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(workouts));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `workout_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        };

        window.importData = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        workouts = imported;
                        localStorage.setItem('simple_workouts', JSON.stringify(workouts));
                        renderWorkouts();
                        alert('データを正常に復元しました！');
                    } else {
                        alert('ファイル形式が正しくありません。');
                    }
                } catch (err) {
                    alert('ファイルの読み込みに失敗しました。');
                }
            };
            reader.readAsText(file);
        };

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // 初期化
        resetSetRows();
        renderWorkouts();
    </script>
</body>
</html>
