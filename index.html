<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPL 筋トレメモ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="theme-color" content="#111827">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 pb-24 max-w-md mx-auto space-y-5">

    <!-- ヘッダー -->
    <header class="flex justify-between items-center bg-gray-800 p-4 rounded-2xl border border-gray-700 shadow">
        <h1 class="text-xl font-bold text-orange-400">💪 PPL Workout</h1>
        <div class="flex gap-2">
            <button onclick="exportData()" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg border border-gray-600">出力</button>
            <label class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg border border-gray-600 cursor-pointer">
                復元
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
            </label>
        </div>
    </header>

    <!-- インターバルタイマー -->
    <div id="timerCard" class="bg-gray-800 border border-gray-700 rounded-2xl p-4 shadow space-y-3 transition-colors">
        <div class="flex justify-between items-center">
            <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">⏱ インターバルタイマー</span>
            <div class="flex items-center gap-3">
                <span id="timerDisplay" class="text-2xl font-mono font-bold text-white">00:00</span>
                <button id="timerResetBtn" onclick="resetTimer()" class="hidden text-xs bg-gray-700 hover:bg-gray-600 text-gray-300 px-2.5 py-1 rounded-lg">リセット</button>
            </div>
        </div>
        <div class="grid grid-cols-5 gap-1.5">
            <button onclick="startTimer(60)" class="bg-gray-900 hover:bg-orange-500/20 border border-gray-700 hover:border-orange-500 text-orange-300 font-bold py-2 rounded-xl text-xs transition active:scale-95">1分</button>
            <button onclick="startTimer(120)" class="bg-gray-900 hover:bg-orange-500/20 border border-gray-700 hover:border-orange-500 text-orange-300 font-bold py-2 rounded-xl text-xs transition active:scale-95">2分</button>
            <button onclick="startTimer(180)" class="bg-gray-900 hover:bg-orange-500/20 border border-gray-700 hover:border-orange-500 text-orange-300 font-bold py-2 rounded-xl text-xs transition active:scale-95">3分</button>
            <button onclick="startTimer(240)" class="bg-gray-900 hover:bg-orange-500/20 border border-gray-700 hover:border-orange-500 text-orange-300 font-bold py-2 rounded-xl text-xs transition active:scale-95">4分</button>
            <button onclick="startTimer(300)" class="bg-gray-900 hover:bg-orange-500/20 border border-gray-700 hover:border-orange-500 text-orange-300 font-bold py-2 rounded-xl text-xs transition active:scale-95">5分</button>
        </div>
    </div>

    <!-- 入力フォーム -->
    <div class="bg-gray-800 border border-gray-700 rounded-2xl p-4 shadow-lg space-y-4">
        <div class="flex justify-between items-center">
            <h2 id="formTitle" class="text-sm font-semibold text-orange-400 uppercase tracking-wider">今日のトレーニングを記録</h2>
            <button id="cancelTargetDateBtn" onclick="resetTargetDate()" class="text-xs text-gray-400 hover:text-white hidden underline">今日に戻す</button>
        </div>
        
        <div>
            <label class="block text-xs text-gray-400 mb-1">種目名</label>
            <input type="text" id="exerciseName" placeholder="例: ベンチプレス" 
                class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500">
        </div>

        <div class="space-y-2">
            <span class="block text-xs text-gray-400">セットごとの重量 × 回数</span>
            <div id="setsContainer" class="space-y-2">
                <div class="set-row flex items-center gap-2">
                    <span class="set-label text-xs font-bold text-gray-400 w-6 text-center">1.</span>
                    <input type="number" step="0.5" placeholder="kg" 
                        class="weight-input w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-white text-center focus:outline-none focus:border-orange-500">
                    <span class="text-gray-500 font-bold">×</span>
                    <input type="number" placeholder="回" 
                        class="reps-input w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-white text-center focus:outline-none focus:border-orange-500">
                    <button type="button" onclick="removeSetRow(this)" style="visibility: hidden;" class="text-gray-500 hover:text-red-400 p-2">✕</button>
                </div>
            </div>
            <button type="button" onclick="addSetRow()" class="w-full py-2.5 border border-dashed border-gray-600 hover:border-orange-400 text-gray-300 hover:text-orange-400 rounded-xl text-sm font-medium transition">
                ＋ セットを追加
            </button>
        </div>

        <button type="button" onclick="saveWorkout()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3.5 rounded-xl shadow-md transition active:scale-[0.98]">
            記録を保存する
        </button>
    </div>

    <!-- 履歴一覧 -->
    <div class="space-y-4">
        <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">トレーニング履歴（タップで開閉）</h2>
        <div id="workoutList" class="space-y-3"></div>
        <div id="emptyMessage" class="text-center text-gray-500 py-10 hidden">
            記録がまだありません。
        </div>
    </div>

    <!-- スクリプト -->
    <script>
        let workouts = JSON.parse(localStorage.getItem('simple_workouts')) || [];
        let targetDateStr = null;

        // --- タイマー処理 ---
        let timerInterval = null;
        let remainingSeconds = 0;

        function startTimer(seconds) {
            clearInterval(timerInterval);
            remainingSeconds = seconds;
            
            const card = document.getElementById('timerCard');
            const display = document.getElementById('timerDisplay');
            const resetBtn = document.getElementById('timerResetBtn');
            
            card.classList.remove('border-emerald-500', 'bg-emerald-950/30');
            card.classList.add('border-orange-500');
            display.classList.remove('text-emerald-400');
            display.classList.add('text-orange-400');
            resetBtn.classList.remove('hidden');

            updateTimerDisplay();

            timerInterval = setInterval(() => {
                remainingSeconds--;
                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    remainingSeconds = 0;
                    updateTimerDisplay();
                    finishTimer();
                } else {
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const m = String(Math.floor(remainingSeconds / 60)).padStart(2, '0');
            const s = String(remainingSeconds % 60).padStart(2, '0');
            document.getElementById('timerDisplay').textContent = `${m}:${s}`;
        }

        function finishTimer() {
            const card = document.getElementById('timerCard');
            const display = document.getElementById('timerDisplay');
            card.classList.remove('border-orange-500');
            card.classList.add('border-emerald-500', 'bg-emerald-950/30');
            display.classList.remove('text-orange-400');
            display.classList.add('text-emerald-400');
            display.textContent = 'GO!';
            if (navigator.vibrate) {
                navigator.vibrate([300, 100, 300, 100, 300]);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            remainingSeconds = 0;
            const card = document.getElementById('timerCard');
            const display = document.getElementById('timerDisplay');
            const resetBtn = document.getElementById('timerResetBtn');
            
            card.classList.remove('border-orange-500', 'border-emerald-500', 'bg-emerald-950/30');
            display.classList.remove('text-orange-400', 'text-emerald-400');
            display.classList.add('text-white');
            display.textContent = '00:00';
            resetBtn.classList.add('hidden');
        }

        // --- 筋トレ記録処理 ---
        function getPplTag(name) {
            const n = name.toLowerCase();
            if (n.includes('ベンチ') || n.includes('プレス') || n.includes('チェスト') || n.includes('ショルダー') || n.includes('レイズ') || n.includes('ディップス') || n.includes('プッシュ') || n.includes('三頭') || n.includes('ダンベル')) {
                return { text: 'PUSH', bg: 'bg-red-950 text-red-300 border-red-800' };
            }
            if (n.includes('プル') || n.includes('ロー') || n.includes('チン') || n.includes('ラット') || n.includes('デッド') || n.includes('カール') || n.includes('背中') || n.includes('二頭')) {
                return { text: 'PULL', bg: 'bg-blue-950 text-blue-300 border-blue-800' };
            }
            if (n.includes('スクワット') || n.includes('レッグ') || n.includes('カーフ') || n.includes('ランジ') || n.includes('脚') || n.includes('腹') || n.includes('アブ')) {
                return { text: 'LEGS', bg: 'bg-emerald-950 text-emerald-300 border-emerald-800' };
            }
            return { text: 'OTHER', bg: 'bg-gray-700 text-gray-300 border-gray-600' };
        }

        function addSetRow(w = '', r = '') {
            const container = document.getElementById('setsContainer');
            const rows = container.querySelectorAll('.set-row');
            const num = rows.length + 1;

            if (w === '' && rows.length > 0) {
                const lastW = rows[rows.length - 1].querySelector('.weight-input').value;
                if (lastW) w = lastW;
            }

            const div = document.createElement('div');
            div.className = 'set-row flex items-center gap-2';
            div.innerHTML = `
                <span class="set-label text-xs font-bold text-gray-400 w-6 text-center">${num}.</span>
                <input type="number" step="0.5" placeholder="kg" value="${w}"
                    class="weight-input w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-white text-center focus:outline-none focus:border-orange-500">
                <span class="text-gray-500 font-bold">×</span>
                <input type="number" placeholder="回" value="${r}"
                    class="reps-input w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-white text-center focus:outline-none focus:border-orange-500">
                <button type="button" onclick="removeSetRow(this)" class="text-gray-500 hover:text-red-400 p-2">✕</button>
            `;
            container.appendChild(div);
            updateNums();
        }

        function removeSetRow(btn) {
            const container = document.getElementById('setsContainer');
            if (container.querySelectorAll('.set-row').length <= 1) return;
            btn.closest('.set-row').remove();
            updateNums();
        }

        function updateNums() {
            const rows = document.querySelectorAll('.set-row');
            rows.forEach((row, idx) => {
                row.querySelector('.set-label').textContent = `${idx + 1}.`;
                row.querySelector('button').style.visibility = rows.length === 1 ? 'hidden' : 'visible';
            });
        }

        function resetForm() {
            document.getElementById('exerciseName').value = '';
            document.getElementById('setsContainer').innerHTML = `
                <div class="set-row flex items-center gap-2">
                    <span class="set-label text-xs font-bold text-gray-400 w-6 text-center">1.</span>
                    <input type="number" step="0.5" placeholder="kg" 
                        class="weight-input w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-white text-center focus:outline-none focus:border-orange-500">
                    <span class="text-gray-500 font-bold">×</span>
                    <input type="number" placeholder="回" 
                        class="reps-input w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-white text-center focus:outline-none focus:border-orange-500">
                    <button type="button" onclick="removeSetRow(this)" style="visibility: hidden;" class="text-gray-500 hover:text-red-400 p-2">✕</button>
                </div>
            `;
        }

        function formatDate(dateStr) {
            const [y, m, d] = dateStr.split('-');
            const date = new Date(y, m - 1, d);
            const w = ['日', '月', '火', '水', '木', '金', '土'][date.getDay()];
            return `${y}/${parseInt(m)}/${parseInt(d)} (${w})`;
        }

        function renderWorkouts() {
            const list = document.getElementById('workoutList');
            const empty = document.getElementById('emptyMessage');
            if (!list) return;
            list.innerHTML = '';

            if (workouts.length === 0) {
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            const grouped = {};
            workouts.forEach(item => {
                if (!grouped[item.dateStr]) grouped[item.dateStr] = [];
                grouped[item.dateStr].push(item);
            });

            const sortedDates = Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a));

            sortedDates.forEach(dateStr => {
                const dayItems = grouped[dateStr];
                const tagsMap = {};
                dayItems.forEach(i => {
                    const t = getPplTag(i.name);
                    tagsMap[t.text] = t;
                });
                const tagsHtml = Object.values(tagsMap).map(t => `<span class="text-[10px] font-bold px-2 py-0.5 rounded border ${t.bg}">${t.text}</span>`).join('');

                const card = document.createElement('div');
                card.className = 'bg-gray-800 border border-gray-700 rounded-2xl p-4 shadow';

                let header = `
                    <div class="flex justify-between items-center cursor-pointer select-none" onclick="toggleDayAccordion(this)">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="text-sm font-bold text-orange-400">📅 ${formatDate(dateStr)}</span>
                            <div class="flex gap-1">${tagsHtml}</div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-gray-400 day-toggle-icon">▼</span>
                            <button type="button" onclick="event.stopPropagation(); setTargetDate('${dateStr}')" class="text-xs bg-orange-600 hover:bg-orange-500 text-white px-2.5 py-1 rounded-lg font-bold">
                                ＋追加
                            </button>
                        </div>
                    </div>
                `;

                let body = '<div class="day-content hidden mt-3 pt-3 border-t border-gray-700 space-y-2">';
                dayItems.forEach(item => {
                    const ppl = getPplTag(item.name);
                    const setsHtml = item.setList.map((s, idx) => `
                        <div class="text-xs text-gray-300 font-semibold flex items-center gap-2">
                            <span class="text-gray-500 w-4">${idx + 1}.</span>
                            <span class="text-orange-300">${s.weight} kg</span> × 
                            <span class="text-orange-300">${s.reps} 回</span>
                        </div>
                    `).join('');

                    body += `
                        <div class="bg-gray-900 border border-gray-700 rounded-xl p-3">
                            <div class="flex justify-between items-center cursor-pointer select-none" onclick="toggleExerciseAccordion(this)">
                                <div class="flex items-center gap-2">
                                    <span class="text-[10px] font-bold px-2 py-0.5 rounded border ${ppl.bg}">${ppl.text}</span>
                                    <span class="text-sm font-bold text-white">${escapeHtml(item.name)}</span>
                                    <span class="text-xs text-gray-500">(${item.setList.length}セット)</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="text-xs text-orange-400 ex-toggle-icon">▼</span>
                                    <button type="button" onclick="event.stopPropagation(); deleteWorkout('${item.id}')" class="text-gray-500 hover:text-red-400 p-1" title="削除">✕</button>
                                </div>
                            </div>
                            <div class="ex-content hidden mt-2 pt-2 border-t border-gray-800 space-y-1">
                                ${setsHtml}
                            </div>
                        </div>
                    `;
                });
                body += '</div>';

                card.innerHTML = header + body;
                list.appendChild(card);
            });
        }

        function toggleDayAccordion(headerElem) {
            const content = headerElem.nextElementSibling;
            const icon = headerElem.querySelector('.day-toggle-icon');
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.textContent = '▲';
            } else {
                content.classList.add('hidden');
                icon.textContent = '▼';
            }
        }

        function toggleExerciseAccordion(headerElem) {
            const content = headerElem.nextElementSibling;
            const icon = headerElem.querySelector('.ex-toggle-icon');
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.textContent = '▲';
            } else {
                content.classList.add('hidden');
                icon.textContent = '▼';
            }
        }

        function setTargetDate(dateStr) {
            targetDateStr = dateStr;
            const [y, m, d] = dateStr.split('-');
            document.getElementById('formTitle').textContent = `${parseInt(m)}月${parseInt(d)}日 に記録を追加`;
            document.getElementById('cancelTargetDateBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetTargetDate() {
            targetDateStr = null;
            document.getElementById('formTitle').textContent = "今日のトレーニングを記録";
            document.getElementById('cancelTargetDateBtn').classList.add('hidden');
        }

        function saveWorkout() {
            const nameInput = document.getElementById('exerciseName');
            const name = nameInput.value.trim();
            if (!name) {
                alert('種目名を入力してください');
                nameInput.focus();
                return;
            }

            const container = document.getElementById('setsContainer');
            const rows = container.querySelectorAll('.set-row');
            const setList = [];
            rows.forEach(row => {
                const w = parseFloat(row.querySelector('.weight-input').value);
                const r = parseInt(row.querySelector('.reps-input').value);
                if (!isNaN(w) && !isNaN(r)) {
                    setList.push({ weight: w, reps: r });
                }
            });

            if (setList.length === 0) {
                alert('有効な重量と回数を入力してください');
                return;
            }

            let dateStr = targetDateStr;
            if (!dateStr) {
