<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <meta name="theme-color" content="#0a0a0b">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 pb-24 max-w-md mx-auto space-y-4">

    <!-- ================= 0. ホームタブ（extras.js が描画） ================= -->
    <div id="tabContentHome" class="space-y-4"></div>

    <!-- ================= 1. トレーニング記録タブ ================= -->
    <div id="tabContentWorkout" class="space-y-4 hidden">

        <!-- インターバルタイマー（常駐） -->
        <div class="bg-gray-800 border border-gray-700 rounded-2xl p-3.5 shadow-md space-y-2.5">
            <div class="flex items-center justify-center text-6xl leading-none font-bold text-orange-400">
                <span id="timerDisplay">00:00</span>
            </div>
            <div class="grid grid-cols-4 gap-2">
                <button type="button" onclick="startTimer(3)" class="py-2.5 bg-gray-900 hover:bg-gray-700 border border-gray-700 rounded-xl text-xs font-bold text-gray-200 transition active:scale-[0.98]">3分</button>
                <button type="button" onclick="startTimer(2)" class="py-2.5 bg-gray-900 hover:bg-gray-700 border border-gray-700 rounded-xl text-xs font-bold text-gray-200 transition active:scale-[0.98]">2分</button>
                <button type="button" onclick="startTimer(1)" class="py-2.5 bg-gray-900 hover:bg-gray-700 border border-gray-700 rounded-xl text-xs font-bold text-gray-200 transition active:scale-[0.98]">1分</button>
                <button type="button" onclick="stopTimer()" class="py-2.5 bg-gray-900 hover:bg-gray-700 border border-gray-700 rounded-xl text-xs font-bold text-gray-400 hover:text-red-400 transition active:scale-[0.98]">✕</button>
            </div>
        </div>

        <!-- 入力フォーム（常駐） -->
        <div class="bg-gray-800 border border-gray-700 rounded-2xl p-3.5 shadow-lg">
            <div id="formHeaderContainer"></div>

            <div class="mb-2.5 relative">
                <label class="block text-xs text-gray-400 mb-0.5">種目名</label>
                <input type="text" id="exerciseName" placeholder="入力" oninput="checkExerciseSuggestion()"
                    class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white text-center focus:outline-none focus:border-orange-500">
                <div id="suggestionBox" class="hidden absolute left-0 right-0 mt-1 bg-gray-900 border border-gray-700 rounded-xl shadow-xl z-20 overflow-hidden"></div>
            </div>

            <div class="space-y-1.5">
                <span class="block text-xs text-gray-400">セット</span>
                <div id="setsContainer" class="space-y-1.5">
                    <div class="set-row flex items-center gap-2">
                        <span class="set-label text-xs font-bold text-gray-400 w-6 text-center">1.</span>
                        <input type="number" step="0.5" placeholder="kg" inputmode="decimal" autocapitalize="off" autocomplete="off" autocorrect="off"
                            class="weight-input w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-white text-center focus:outline-none focus:border-orange-500">
                        <span class="text-gray-500 font-bold">×</span>
                        <input type="number" placeholder="回" inputmode="numeric" autocapitalize="off" autocomplete="off" autocorrect="off"
                            class="reps-input w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-white text-center focus:outline-none focus:border-orange-500">
                        <button type="button" onclick="removeSetRow(this)" style="visibility: hidden;" class="text-gray-500 hover:text-red-400 p-2">✕</button>
                    </div>
                </div>

                <div class="pt-1 bg-gray-900 border border-gray-700 rounded-xl overflow-hidden">
                    <button type="button" onclick="addSetRow()" class="w-full py-2.5 text-gray-300 hover:text-orange-400 hover:bg-gray-800/70 text-sm font-medium transition">
                        ＋ セット
                    </button>
                    <button type="button" id="saveBtn" onclick="saveWorkout()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3.5 border-t border-gray-700 transition active:scale-[0.98]">
                        保存
                    </button>
                </div>
            </div>
        </div>

        <!-- サブタブ切り替えバー＋下部コンテンツ密着グループ -->
        <div class="bg-gray-800 border border-gray-700 rounded-2xl shadow-md overflow-hidden">
            <!-- サブタブ切り替えバー -->
            <div class="flex bg-gray-800 p-1">
                <button type="button" onclick="switchWorkoutSubTab('history')" id="subTabBtnHistory" class="flex-1 py-2 text-xs font-bold rounded-xl text-orange-400 bg-gray-900 shadow transition">
                    履歴
                </button>
                <button type="button" onclick="switchWorkoutSubTab('stats')" id="subTabBtnStats" class="flex-1 py-2 text-xs font-bold rounded-xl text-gray-400 hover:text-white transition">
                    推移
                </button>
            </div>

            <!-- サブコンテンツ1：履歴 -->
            <div id="subTabContentHistory">
                <div id="workoutListWrapper" class="hidden">
                    <div id="workoutList" class="divide-y divide-gray-700"></div>
                    <div id="workoutMoreContainer"></div>
                </div>
                <div id="emptyMessage" class="text-center text-gray-500 py-10 hidden">
                    記録がまだありません。
                </div>
            </div>

            <!-- サブコンテンツ2：推移（extras.js が4種目の折れ線を描画） -->
            <div id="subTabContentStats" class="hidden">
                <div id="trendList"></div>
            </div>
        </div>
    </div>

    <!-- ================= 2. 有酸素タブ ================= -->
    <div id="tabContentCardio" class="space-y-4 hidden">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl p-3.5 shadow-lg">
            <label class="block text-xs text-gray-400 mb-0.5">時間 (分)</label>
            <div class="bg-gray-900 border border-gray-700 rounded-xl overflow-hidden">
                <input type="number" id="cardioMinutes" placeholder="入力" inputmode="numeric"
                    class="w-full bg-gray-900 px-4 py-3 text-white text-center focus:outline-none">
                <button type="button" onclick="saveCardio()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3.5 border-t border-gray-700 transition active:scale-[0.98]">
                    保存
                </button>
            </div>
        </div>

        <div class="space-y-2.5">
            <h2 class="text-sm font-semibold text-orange-400 uppercase tracking-wider">今月合計</h2>
            <div class="bg-gray-800 border border-gray-700 rounded-2xl shadow overflow-hidden">
                <div class="p-3.5">
                    <div id="monthlyCardioSummary" class="text-xs text-white font-bold tracking-tight">回数: 0回 / 時間: 0分 / 消費: 約0kcal</div>
                </div>
                <div id="cardioListWrapper" class="border-t border-gray-700 hidden">
                    <div id="cardioList" class="divide-y divide-gray-700"></div>
                    <div id="cardioMoreContainer"></div>
                </div>
            </div>
            <div id="emptyCardioMessage" class="text-center text-gray-500 py-10 hidden">
                有酸素の記録がまだありません。
            </div>
        </div>
    </div>

    <!-- ================= 3. 比較/設定タブ ================= -->
    <div id="tabContentSettings" class="space-y-4 hidden">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl p-3.5 shadow-lg space-y-2.5">
            <h2 class="text-sm font-semibold text-orange-400 uppercase tracking-wider">今月 / 先月ポイント比較</h2>
            <div class="bg-gray-900 border border-gray-700 rounded-xl divide-y divide-gray-700">
                <div id="compareWorkoutPoints" class="p-3 text-xs font-bold text-white">トレ：今月 0pt / 先月 0pt</div>
                <div id="compareCardioPoints" class="p-3 text-xs font-bold text-white">有酸素：今月 0pt / 先月 0pt</div>
            </div>
        </div>

        <div class="bg-gray-800 border border-gray-700 rounded-2xl p-3.5 shadow-lg space-y-3">
            <h2 class="text-sm font-semibold text-orange-400 uppercase tracking-wider">バックアップ出力/復元</h2>
            <div class="space-y-2 pt-1">
                <button type="button" onclick="exportData()" class="w-full bg-gray-900 hover:bg-gray-700 text-gray-200 py-3 rounded-xl border border-gray-700 text-xs font-bold transition">
                    出力 (JSON)
                </button>
            </div>
            <div class="space-y-2 pt-3 border-t border-gray-700">
                <textarea id="importText" rows="4" placeholder="JSON貼り付け"
                    class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-orange-500"></textarea>
                <button type="button" onclick="importFromJsonText()" class="w-full bg-gray-900 hover:bg-gray-700 text-gray-200 py-3 rounded-xl border border-gray-700 text-xs font-bold transition">
                    復元実行
                </button>
            </div>
        </div>
    </div>

    <!-- ================= 下タブ（画面下に固定） ================= -->
    <nav id="bottomNav">
        <button type="button" data-t="home" onclick="switchTab('home')">ホーム</button>
        <button type="button" data-t="workout" onclick="switchTab('workout')">トレーニング</button>
        <button type="button" data-t="cardio" onclick="switchTab('cardio')">有酸素</button>
        <button type="button" data-t="settings" onclick="switchTab('settings')">比較/設定</button>
    </nav>

    <script>
        function sanitizeWorkouts(rawWorkouts) {
            if (!Array.isArray(rawWorkouts)) return [];
            const uniqueMap = new Map();
            rawWorkouts.forEach(item => {
                if (!item || typeof item !== 'object') return;
                const id = item.id || String(Date.now() + Math.random());
                let setList = [];
                const rawSets = item.setList || [];
                if (Array.isArray(rawSets)) {
                    setList = rawSets.map(set => ({
                        weight: Number(set.weight) || 0,
                        reps: Number(set.reps) || 0
                    }));
                }
                uniqueMap.set(id, {
                    id: String(id),
                    name: String(item.name || '不明な種目'),
                    dateStr: String(item.dateStr || '2026-01-01'),
                    setList: setList
                });
            });
            return Array.from(uniqueMap.values());
        }

        function sanitizeCardios(rawCardios) {
            if (!Array.isArray(rawCardios)) return [];
            const uniqueMap = new Map();
            rawCardios.forEach(item => {
                if (!item || typeof item !== 'object') return;
                const id = item.id || String(Date.now() + Math.random());
                uniqueMap.set(id, {
                    id: String(id),
                    minutes: Number(item.minutes) || 0,
                    dateStr: String(item.dateStr || '2026-01-01')
                });
            });
            return Array.from(uniqueMap.values());
        }

        let workouts = sanitizeWorkouts(JSON.parse(localStorage.getItem('simple_workouts')) || []);
        let cardios = sanitizeCardios(JSON.parse(localStorage.getItem('simple_cardios')) || []);
        let dayPplMap = JSON.parse(localStorage.getItem('simple_day_ppl')) || {};
        let editingId = null;
        let visibleDaysCount = 5;
        let visibleCardioDaysCount = 5;

        let timerInterval = null;
        let alarmInterval = null;
        let targetEndTime = null;
        let sharedAudioCtx = null;

        function getAudioContext() {
            if (!sharedAudioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                sharedAudioCtx = new AudioContextClass();
            }
            if (sharedAudioCtx.state === 'suspended') {
                sharedAudioCtx.resume();
            }
            return sharedAudioCtx;
        }

        function startTimer(minutes) {
            stopTimer();
            targetEndTime = Date.now() + minutes * 60 * 1000;
            updateTimerDisplay();
            timerInterval = setInterval(updateTimerDisplay, 200);
        }

        function updateTimerDisplay() {
            if (!targetEndTime) return;
            const now = Date.now();
            const diff = targetEndTime - now;

            if (diff <= 0) {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                targetEndTime = null;
                document.getElementById('timerDisplay').textContent = '00:00';

                if (!alarmInterval) {
                    playSingleBeep();
                    alarmInterval = setInterval(playSingleBeep, 400);
                }
                return;
            }

            const totalSec = Math.ceil(diff / 1000);
            const m = Math.floor(totalSec / 60);
            const s = totalSec % 60;
            document.getElementById('timerDisplay').textContent =
                String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
            targetEndTime = null;
            const display = document.getElementById('timerDisplay');
            if (display) display.textContent = '00:00';
        }

        function playSingleBeep() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {
                console.log(e);
            }
        }

        /* タブ切り替え switchTab は extras.js に移動しました */

        function switchWorkoutSubTab(subTabName) {
            const statsContent = document.getElementById('subTabContentStats');
            const historyContent = document.getElementById('subTabContentHistory');
            const statsBtn = document.getElementById('subTabBtnStats');
            const historyBtn = document.getElementById('subTabBtnHistory');

            statsContent.classList.add('hidden');
            historyContent.classList.add('hidden');

            statsBtn.className = 'flex-1 py-2 text-xs font-bold rounded-xl text-gray-400 hover:text-white transition';
            historyBtn.className = 'flex-1 py-2 text-xs font-bold rounded-xl text-gray-400 hover:text-white transition';

            if (subTabName === 'stats') {
                statsContent.classList.remove('hidden');
                statsBtn.className = 'flex-1 py-2 text-xs font-bold rounded-xl text-orange-400 bg-gray-900 shadow transition';
            } else if (subTabName === 'history') {
                historyContent.classList.remove('hidden');
                historyBtn.className = 'flex-1 py-2 text-xs font-bold rounded-xl text-orange-400 bg-gray-900 shadow transition';
            }
        }

        function checkExerciseSuggestion() {
            const query = document.getElementById('exerciseName').value.trim().toLowerCase();
            const box = document.getElementById('suggestionBox');
            if (!box) return;

            if (!query || editingId !== null) {
                box.classList.add('hidden');
                box.innerHTML = '';
                return;
            }

            const sortedWorkouts = [...workouts].sort((a, b) => Number(b.id) - Number(a.id));
            const matched = [];
            const seenNames = new Set();

            for (const workout of sortedWorkouts) {
                if (workout.name.toLowerCase().startsWith(query)) {
                    if (!seenNames.has(workout.name)) {
                        seenNames.add(workout.name);
                        matched.push(workout);
                    }
                }
            }

            if (matched.length === 0) {
                box.classList.add('hidden');
                box.innerHTML = '';
                return;
            }

            const displayItems = matched.slice(0, 5);
            let html = '';

            for (const item of displayItems) {
                html += `
                    <button type="button" onclick="applySuggestion('${item.id}')" class="w-full px-4 py-3 text-left text-xs text-gray-200 hover:bg-gray-800 hover:text-orange-400 border-b border-gray-800 last:border-b-0 transition flex justify-between items-center">
                        <span class="font-bold">${formatDate(item.dateStr)}  ${escapeHtml(item.name)}</span>
                        <span class="text-gray-500 text-[10px]">${item.setList.length}セット</span>
                    </button>
                `;
            }

            box.classList.remove('hidden');
            box.innerHTML = html;
        }

        function applySuggestion(id) {
            const target = workouts.find(i => i.id === id);
            if (!target) return;

            document.getElementById('exerciseName').value = target.name;
            document.getElementById('suggestionBox').classList.add('hidden');
            document.getElementById('suggestionBox').innerHTML = '';

            const container = document.getElementById('setsContainer');
            container.innerHTML = '';
            target.setList.forEach(set => addSetRow(set.weight, set.reps));
        }

        function addSetRow(w = '', r = '') {
            const container = document.getElementById('setsContainer');
            if (!container) return;
            const rows = container.querySelectorAll('.set-row');
            const num = rows.length + 1;
            if (w === '' && rows.length > 0) {
                const lastW = rows[rows.length - 1].querySelector('.weight-input').value;
                if (lastW) w = lastW;
            }
            const div = document.createElement('div');
            div.className = 'set-row flex items-center gap-2';
            div.innerHTML = `
                <span class="set-label text-xs font-bold text-gray-400 w-6 text-center">${num}.</span>
                <input type="number" step="0.5" placeholder="kg" value="${w}" inputmode="decimal" autocapitalize="off" autocomplete="off" autocorrect="off"
                    class="weight-input w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-white text-center focus:outline-none focus:border-orange-500">
                <span class="text-gray-500 font-bold">×</span>
                <input type="number" placeholder="回" value="${r}" inputmode="numeric" autocapitalize="off" autocomplete="off" autocorrect="off"
                    class="reps-input w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-white text-center focus:outline-none focus:border-orange-500">
                <button type="button" onclick="removeSetRow(this)" class="text-gray-500 hover:text-red-400 p-2">✕</button>
            `;
            container.appendChild(div);
            updateNums();
        }

        function removeSetRow(btn) {
            const container = document.getElementById('setsContainer');
            if (!container) return;
            const rows = container.querySelectorAll('.set-row');
            if (rows.length <= 1) return;
            btn.closest('.set-row').remove();
            updateNums();
        }

        function updateNums() {
            const rows = document.querySelectorAll('.set-row');
            rows.forEach((row, idx) => {
                row.querySelector('.set-label').textContent = `${idx + 1}.`;
                row.querySelector('button').style.visibility = rows.length === 1 ? 'hidden' : 'visible';
            });
        }

        function resetForm() {
            editingId = null;
            document.getElementById('exerciseName').value = '';
            document.getElementById('suggestionBox').classList.add('hidden');
            document.getElementById('suggestionBox').innerHTML = '';
            document.getElementById('formHeaderContainer').innerHTML = '';
            document.getElementById('saveBtn').textContent = '保存';
            const container = document.getElementById('setsContainer');
            if (!container) return;
            container.innerHTML = `
                <div class="set-row flex items-center gap-2">
                    <span class="set-label text-xs font-bold text-gray-400 w-6 text-center">1.</span>
                    <input type="number" step="0.5" placeholder="kg" inputmode="decimal" autocapitalize="off" autocomplete="off" autocorrect="off"
                        class="weight-input w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-white text-center focus:outline-none focus:border-orange-500">
                    <span class="text-gray-500 font-bold">×</span>
                    <input type="number" placeholder="回" inputmode="numeric" autocapitalize="off" autocomplete="off" autocorrect="off"
                        class="reps-input w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-white text-center focus:outline-none focus:border-orange-500">
                    <button type="button" onclick="removeSetRow(this)" style="visibility: hidden;" class="text-gray-500 hover:text-red-400 p-2">✕</button>
                </div>
            `;
        }

        function cancelEdit() { resetForm(); }

        function editWorkout(id) {
            const target = workouts.find(i => i.id === id);
            if (!target) return;
            editingId = id;
            document.getElementById('suggestionBox').classList.add('hidden');

            document.getElementById('formHeaderContainer').innerHTML = `
                <div class="flex justify-between items-center mb-2.5">
                    <h2 class="text-sm font-semibold text-orange-400 uppercase tracking-wider">編集中</h2>
                    <button type="button" onclick="cancelEdit()" class="text-xs text-gray-400 hover:text-white">キャンセル</button>
                </div>
            `;
            document.getElementById('saveBtn').textContent = '更新';

            document.getElementById('exerciseName').value = target.name;
            const container = document.getElementById('setsContainer');
            container.innerHTML = '';
            target.setList.forEach(set => addSetRow(set.weight, set.reps));
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.getElementById('exerciseName').focus();
        }

        function formatDate(dateStr) {
            const parts = dateStr.split('-');
            return `${parseInt(parts[1])}/${parseInt(parts[2])}`;
        }

        function updateDayPpl(dateStr, selectElem) {
            dayPplMap[dateStr] = selectElem.value;
            localStorage.setItem('simple_day_ppl', JSON.stringify(dayPplMap));
            renderWorkouts();
        }

        /* 「比較/設定」タブのトレーニングポイント（今月/先月の記録日数）だけを計算 */
        function updateMonthlyWorkoutSummary() {
            const compareWorkoutElem = document.getElementById('compareWorkoutPoints');
            if (!compareWorkoutElem) return;

            const now = new Date();
            const currentYearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            const lastMonthDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
            const lastYearMonth = `${lastMonthDate.getFullYear()}-${String(lastMonthDate.getMonth() + 1).padStart(2, '0')}`;

            let currentWorkoutCount = 0;
            let lastWorkoutCount = 0;
            new Set(workouts.map(i => i.dateStr)).forEach(dateStr => {
                if (dateStr.startsWith(currentYearMonth)) currentWorkoutCount++;
                else if (dateStr.startsWith(lastYearMonth)) lastWorkoutCount++;
            });

            compareWorkoutElem.textContent = `トレ：今月 ${currentWorkoutCount}pt / 先月 ${lastWorkoutCount}pt`;
        }
        function renderWorkouts() {
            const wrapper = document.getElementById('workoutListWrapper');
            const list = document.getElementById('workoutList');
            const moreContainer = document.getElementById('workoutMoreContainer');
            const empty = document.getElementById('emptyMessage');
            if (!list || !wrapper) return;
            list.innerHTML = '';
            if (moreContainer) moreContainer.innerHTML = '';

            updateMonthlyWorkoutSummary();

            if (workouts.length === 0) {
                wrapper.classList.add('hidden');
                if (empty) empty.classList.remove('hidden');
                renderCardios();
                return;
            }
            wrapper.classList.remove('hidden');
            if (empty) empty.classList.add('hidden');

            const grouped = {};
            workouts.forEach(item => {
                if (!grouped[item.dateStr]) grouped[item.dateStr] = [];
                grouped[item.dateStr].push(item);
            });

            const sortedDates = Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a));
            const displayDates = sortedDates.slice(0, visibleDaysCount);

            displayDates.forEach(dateStr => {
                const dayItems = grouped[dateStr];
                let totalVolume = 0;
                dayItems.forEach(item => {
                    item.setList.forEach(set => { totalVolume += (set.weight * set.reps); });
                });
                const formattedVolume = Math.round(totalVolume).toLocaleString();
                const currentPpl = dayPplMap[dateStr] || 'PUSH';

                const row = document.createElement('div');
                row.className = 'p-4';

                let header = `
                    <div class="flex justify-between items-center cursor-pointer select-none" onclick="toggleDayAccordion(this)">
                        <div class="flex items-center gap-2.5 flex-wrap">
                            <span class="text-sm font-bold text-orange-400">${formatDate(dateStr)}</span>
                            <span class="text-xs text-white font-bold">総負荷: <span class="text-white">${formattedVolume}</span>kg</span>
                            <select onclick="event.stopPropagation()" onchange="updateDayPpl('${dateStr}', this)" class="text-xs bg-gray-900 border border-gray-700 text-gray-200 font-bold rounded-lg px-2 py-1 focus:outline-none focus:border-orange-500">
                                <option value="PUSH" ${currentPpl === 'PUSH' ? 'selected' : ''}>PUSH</option>
                                <option value="PULL" ${currentPpl === 'PULL' ? 'selected' : ''}>PULL</option>
                                <option value="LEGS" ${currentPpl === 'LEGS' ? 'selected' : ''}>LEGS</option>
                                <option value="OTHER" ${currentPpl === 'OTHER' ? 'selected' : ''}>OTHER</option>
                            </select>
                        </div>
                        <span class="text-xs text-gray-400 day-toggle-icon">▼</span>
                    </div>
                `;

                let body = '<div class="day-content hidden mt-3 pt-3 border-t border-gray-700 space-y-2">';
                dayItems.forEach(item => {
                    const setsHtml = item.setList.map((s, idx) => `
                        <div class="text-xs text-gray-300 font-semibold flex items-center gap-2">
                            <span class="text-gray-500 w-4">${idx + 1}.</span>
                            <span class="text-white">${s.weight} kg</span> ×
                            <span class="text-white">${s.reps} 回</span>
                        </div>
                    `).join('');

                    body += `
                        <div class="bg-gray-900 border border-gray-700 rounded-xl p-3">
                            <div class="flex justify-between items-center cursor-pointer select-none" onclick="toggleExerciseAccordion(this)">
                                <div class="flex items-center gap-2">
                                    <span class="text-sm font-bold text-white">${escapeHtml(item.name)}</span>
                                    <span class="text-xs text-gray-500">(${item.setList.length}セット)</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="text-xs text-gray-400 ex-toggle-icon">▼</span>
                                    <button type="button" onclick="event.stopPropagation(); editWorkout('${item.id}')" class="text-xs text-gray-400 hover:text-white px-2 py-1 bg-gray-800 border border-gray-700 rounded-lg font-medium">編集</button>
                                    <button type="button" onclick="event.stopPropagation(); deleteWorkout('${item.id}')" class="text-gray-500 hover:text-red-400 p-1">✕</button>
                                </div>
                            </div>
                            <div class="ex-content hidden mt-2 pt-2 border-t border-gray-800 space-y-1">
                                ${setsHtml}
                            </div>
                        </div>
                    `;
                });
                body += '</div>';

                row.innerHTML = header + body;
                list.appendChild(row);
            });

            if (sortedDates.length > visibleDaysCount && moreContainer) {
                const moreBtn = document.createElement('button');
                moreBtn.type = 'button';
                moreBtn.onclick = loadMoreDays;
                moreBtn.className = 'w-full py-3 bg-gray-800 hover:bg-gray-700 text-gray-200 text-sm font-bold border-t border-gray-700 transition active:scale-[0.98]';
                moreBtn.textContent = '＋';
                moreContainer.appendChild(moreBtn);
            }

            renderCardios();
        }

        function loadMoreDays() {
            visibleDaysCount += 5;
            renderWorkouts();
        }

        function loadMoreCardioDays() {
            visibleCardioDaysCount += 5;
            renderCardios();
        }

        /* 履歴の開閉（toggleDayAccordion / toggleExerciseAccordion）と
           削除確認（deleteWorkout / deleteCardio）は extras.js に移動しました */

        function saveWorkout() {
            const nameInput = document.getElementById('exerciseName');
            const name = nameInput.value.trim();
            if (!name) {
                alert('種目名を入力してください');
                nameInput.focus();
                return;
            }

            const container = document.getElementById('setsContainer');
            const rows = container.querySelectorAll('.set-row');
            const setList = [];
            rows.forEach(row => {
                const w = parseFloat(row.querySelector('.weight-input').value);
                const r = parseInt(row.querySelector('.reps-input').value);
                if (!isNaN(w) && !isNaN(r)) {
                    setList.push({ weight: w, reps: r });
                }
            });

            if (setList.length === 0) {
                alert('有効な重量と回数を入力してください');
                return;
            }

            if (editingId) {
                const target = workouts.find(i => i.id === editingId);
                if (target) {
                    target.name = name;
                    target.setList = setList;
                }
            } else {
                const now = new Date();
                const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                const existing = workouts.find(i => i.dateStr === dateStr && i.name === name);
                if (existing) {
                    existing.setList = existing.setList.concat(setList);
                } else {
                    workouts.push({ id: Date.now().toString(), name, dateStr, setList });
                }
            }

            localStorage.setItem('simple_workouts', JSON.stringify(workouts));
            resetForm();
            renderWorkouts();
            nameInput.focus();
        }

        function saveCardio() {
            const minInput = document.getElementById('cardioMinutes');
            const minutes = parseInt(minInput.value);

            if (isNaN(minutes) || minutes <= 0) {
                alert('有効な時間を入力してください');
                minInput.focus();
                return;
            }

            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

            const existingCardio = cardios.find(i => i.dateStr === dateStr);
            if (existingCardio) {
                existingCardio.minutes += minutes;
            } else {
                cardios.push({
                    id: Date.now().toString(),
                    minutes: minutes,
                    dateStr: dateStr
                });
            }

            localStorage.setItem('simple_cardios', JSON.stringify(cardios));
            minInput.value = '';
            renderCardios();
        }

        function renderCardios() {
            const wrapper = document.getElementById('cardioListWrapper');
            const list = document.getElementById('cardioList');
            const moreContainer = document.getElementById('cardioMoreContainer');
            const empty = document.getElementById('emptyCardioMessage');
            const summary = document.getElementById('monthlyCardioSummary');
            const compareCardioElem = document.getElementById('compareCardioPoints');
            if (!list || !wrapper) return;
            list.innerHTML = '';
            if (moreContainer) moreContainer.innerHTML = '';

            const now = new Date();
            const currentYearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            const lastMonthDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
            const lastYearMonth = `${lastMonthDate.getFullYear()}-${String(lastMonthDate.getMonth() + 1).padStart(2, '0')}`;

            const monthlyItems = cardios.filter(i => i.dateStr.startsWith(currentYearMonth));
            const lastMonthlyItems = cardios.filter(i => i.dateStr.startsWith(lastYearMonth));

            const totalCount = monthlyItems.length;
            const totalMin = monthlyItems.reduce((sum, i) => sum + i.minutes, 0);
            const lastTotalMin = lastMonthlyItems.reduce((sum, i) => sum + i.minutes, 0);
            const totalKcal = Math.round(totalMin * 3.5);

            if (summary) {
                summary.textContent = `回数: ${totalCount}回 / 時間: ${totalMin}分 / 消費: 約${totalKcal}kcal`;
            }

            if (compareCardioElem) {
                compareCardioElem.textContent = `有酸素：今月 ${totalMin}pt / 先月 ${lastTotalMin}pt`;
            }

            if (cardios.length === 0) {
                wrapper.classList.add('hidden');
                if (empty) empty.classList.remove('hidden');
                return;
            }
            wrapper.classList.remove('hidden');
            if (empty) empty.classList.add('hidden');

            const sortedDates = [...new Set(cardios.map(i => i.dateStr))].sort((a, b) => new Date(b) - new Date(a));
            const displayDates = sortedDates.slice(0, visibleCardioDaysCount);

            displayDates.forEach(dateStr => {
                const dayCardio = cardios.find(i => i.dateStr === dateStr);
                if (!dayCardio) return;

                const dayKcal = Math.round(dayCardio.minutes * 3.5);
                const div = document.createElement('div');
                div.className = 'p-3.5 flex justify-between items-center';
                div.innerHTML = `
                    <div class="flex items-center gap-2.5">
                        <span class="text-sm font-bold text-orange-400">${formatDate(dateStr)}</span>
                        <span class="text-xs text-white">${dayCardio.minutes}分 / 約${dayKcal}kcal</span>
                    </div>
                    <button type="button" onclick="deleteCardio('${dayCardio.id}')" class="text-gray-500 hover:text-red-400 p-1">✕</button>
                `;
                list.appendChild(div);
            });

            if (sortedDates.length > visibleCardioDaysCount && moreContainer) {
                const moreBtn = document.createElement('button');
                moreBtn.type = 'button';
                moreBtn.onclick = loadMoreCardioDays;
                moreBtn.className = 'w-full py-3 bg-gray-800 hover:bg-gray-700 text-gray-200 text-sm font-bold border-t border-gray-700 transition active:scale-[0.98]';
                moreBtn.textContent = '＋';
                moreContainer.appendChild(moreBtn);
            }
        }

        function exportData() {
            const exportObj = {
                workouts: workouts,
                cardios: cardios,
                dayPplMap: dayPplMap
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = `ppl_workout_backup_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        function importFromJsonText() {
            const text = document.getElementById('importText').value.trim();
            if (!text) {
                alert('JSONテキストが入力されていません。');
                return;
            }
            try {
                const imported = JSON.parse(text);
                let rawWorkouts = [];
                let rawCardios = [];

                if (Array.isArray(imported)) {
                    rawWorkouts = imported;
                } else if (imported && typeof imported === 'object') {
                    rawWorkouts = imported.workouts || [];
                    rawCardios = imported.cardios || [];
                    dayPplMap = imported.dayPplMap || {};
                }

                workouts = sanitizeWorkouts(rawWorkouts);
                cardios = sanitizeCardios(rawCardios);

                localStorage.setItem('simple_workouts', JSON.stringify(workouts));
                localStorage.setItem('simple_cardios', JSON.stringify(cardios));
                localStorage.setItem('simple_day_ppl', JSON.stringify(dayPplMap));
                resetForm();
                renderWorkouts();
                alert('データを正常に復元しました！');
                document.getElementById('importText').value = '';
            } catch (err) {
                alert('JSONの形式が正しくありません。入力内容を確認してください。');
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
        }

        renderWorkouts();
    </script>
    <script src="extras.js"></script>
</body>
</html>
